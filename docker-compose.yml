services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agent_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_network"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_backend
    restart: on-failure
    # LLM keys (GEMINI_API_KEY, LLM_MODEL, etc.) come from backend/.env so you
    # don't have to export them into your shell before `docker compose up`.
    env_file:
      - ./backend/.env
    # These override anything in env_file — the container must reach the DB and
    # Redis by their docker-network hostnames, not the localhost in backend/.env.
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/agent_network?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent_frontend
    restart: on-failure
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
